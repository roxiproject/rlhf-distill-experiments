# Default experiment configuration for rlhf-distill-experiments.
# Override any of these via a custom YAML file passed to --config.

n_samples: 800
noise: 0.2
teacher_hidden: 64
student_hidden: 4
teacher_epochs: 60
student_epochs: 60
batch_size: 32
lr: 0.01
temperature: 3.0
alpha: 0.3
seed: 0

# Used only by the `ablate` subcommand.
temperatures: [1.0, 2.0, 4.0, 8.0]
alphas: [0.1, 0.3, 0.5, 0.7]
